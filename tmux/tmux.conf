set -g mouse on
set -g history-limit 10000

# --- ergonomics ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off

# --- status bar ---
set -g status-interval 1
set -g status-right-length 120
set -g status-style "bg=colour235,fg=colour252"
set -g status-left "#[fg=black,bg=green] #S #[default]"
set -g status-right "#[fg=colour220]#(~/.tmux-status.sh) #[fg=colour238]%Y-%m-%d #[fg=colour245]%H:%M #[fg=black,bg=cyan] #h #[default]"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=black,bg=green] #I:#W #[default]"
set -g window-status-activity-style "fg=colour220"

# --- searchable keybinding finder: press F1 (fn+F1 on a Mac) ---
# Opens a fzf popup over `tmux list-keys`; Enter hands the command to the
# tmux command prompt, pre-filled, for review before running.
bind -n F1 run-shell 'tmux display-popup -E -h 80% -w 80% -t "#{pane_id}" ~/.tmux-find.sh "#{pane_id}"'

# --- shortcut menu: prefix + / ---
# Note: q, Up and Down are tmux's own menu keys (exit / navigate), and a bare
# `;` splits commands, so none of those may be used as item shortcuts.
bind / display-menu -T "tmux #{session_name}" \
  "Next Pane" o { select-pane -t .+ } \
  "Last Pane" L { select-pane -l } \
  "Pane Left" h { select-pane -L } \
  "Pane Down" j { select-pane -D } \
  "Pane Up" k { select-pane -U } \
  "Pane Right" l { select-pane -R } \
  "Show Pane Numbers" P { display-panes } \
  "Zoom Toggle" z { resize-pane -Z } \
  "New Window" c { new-window } \
  "Next Window" n { next-window } \
  "Kill Window" & { confirm-before kill-window } \
  "Copy Mode" [ { copy-mode } \
  "Paste" ] { paste-buffer } \
  "" \
  "Command…" : { command-prompt -T command -p "tmux:" } \
  "Key Search…" / { run-shell 'tmux display-popup -E -h 80% -w 80% -t "#{pane_id}" ~/.tmux-find.sh "#{pane_id}"' } \
  "Reload Config" R { source-file ~/.tmux.conf; display-message 'config reloaded' } \
  "Detach" d { detach-client } \
  "Close Session" X { confirm-before -p "Kill session #S? (y/n)" kill-session }

# --- reload config without restarting ---
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
