set -g mouse on
set -g history-limit 10000

# --- status bar ---
set -g status-interval 1
set -g status-right-length 120
set -g status-style "bg=colour235,fg=colour252"
set -g status-left "#[fg=black,bg=green] #S #[default]"
set -g status-right "#[fg=colour220]#(/home/pi/repos/teaching/tmux/status.sh) #[fg=colour238]%Y-%m-%d #[fg=colour245]%H:%M #[fg=black,bg=cyan] #h #[default]"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=black,bg=green] #I:#W #[default]"
set -g window-status-activity-style "fg=colour220"

# --- shortcut menu: press F1 ---
bind -n F1 display-menu -T "tmux #{session_name}" \
  "Next Pane" o select-pane -t .+ \
  "Last Pane (C-b ;)" "" select-pane -l \
  "Pane Left" Left select-pane -L \
  "Pane Right" Right select-pane -R \
  "Pane Up" Up select-pane -U \
  "Pane Down" Down select-pane -D \
  "Show Pane Numbers" q display-panes \
  "" \
  "Close Session" s confirm-before -p "Kill session #S? (y/n)" kill-session \
  "" \
  "Detach" d detach-client

# --- reload config without restarting ---
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
